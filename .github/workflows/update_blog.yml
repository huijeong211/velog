name: Update Blog Posts

on:
  schedule:
    # 매일 한국 시간 오전 9시(UTC 00:00)에 자동으로 벨로그 글을 확인하고 잔디를 심습니다.
    - cron: '0 0 * * *'
  workflow_dispatch: # Actions 탭에서 수동으로 'Run workflow' 누를 수 있게 함

jobs:
  update_blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 깃허브 봇에게 저장소 쓰기 권한 부여
      
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install feedparser gitpython

    - name: Run script
      run: python update_blog.py

    - name: Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git commit -m "Update blog posts" || exit 0
        git push
